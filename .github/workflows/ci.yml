name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifest.json is valid JSON and parses as Manifest V3
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));
            if (m.manifest_version !== 3) throw new Error('expected manifest_version 3, got ' + m.manifest_version);
            if (!m.background || !m.background.service_worker) throw new Error('missing background.service_worker');
            console.log('manifest.json ok: v' + m.version);
          "
      - name: every file manifest.json / package.json's pack script references actually exists
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const referenced = new Set();
            referenced.add(m.background.service_worker);
            for (const cs of m.content_scripts || []) for (const f of cs.js || []) referenced.add(f);
            for (const key of Object.keys(m.icons || {})) referenced.add(m.icons[key]);
            if (m.action && m.action.default_popup) referenced.add(m.action.default_popup);
            if (m.action && m.action.default_icon) for (const k of Object.keys(m.action.default_icon)) referenced.add(m.action.default_icon[k]);
            const packFiles = pkg.scripts.pack.split(/\s+/).filter(tok => /\.(js|html|png|json)$/.test(tok));
            for (const f of packFiles) referenced.add(f);
            let missing = [];
            for (const f of referenced) if (!fs.existsSync(f)) missing.push(f);
            if (missing.length) { console.error('missing files referenced by manifest.json/package.json:', missing); process.exit(1); }
            console.log('all', referenced.size, 'referenced files exist');
          "
